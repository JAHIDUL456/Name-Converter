name: Release Preparation & Trusted Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run dry-run publish verification without uploading to npm"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run dict:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:accuracy
      - run: npm run pack:verify

      - name: Dry-run npm publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run

      - name: Publish to npm via Trusted Publishing (OIDC)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm publish --provenance --access public --tag beta
